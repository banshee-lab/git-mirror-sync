services:
  forgejo-sync:
    build: .
    env_file: .env
    volumes:
      - cache_data:/var/cache/forgejo-sync
      - ./fixtures/forgejo-data:/var/lib/forgejo:ro
      - ./fixtures/ssh/placeholder.txt:/etc/forgejo-sync/ssh/id_rsa:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - 8080:8080
      - 8081:8081
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: forgejo_password
      POSTGRES_DB: forgejo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5

