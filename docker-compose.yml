services:
  forgejo-sync:
    build:
      context: .
    env_file: .env
    environment:
      LISTEN_ADDR: ":8080"
      CACHE_DIR: /var/cache/forgejo-sync
      APP_DB_PATH: /var/cache/forgejo-sync/app.db
      SSH_KEYS_DIR: /var/cache/forgejo-sync/keys
      MODE: development
    volumes:
      - cache_data:/var/cache/forgejo-sync
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - "8080:8080"

volumes:
  cache_data:
